[package]
name = "formally-support"
description = "the open-source formal methods toolchain - basic support functionality"
homepage = "https://formally.fm"
repository = "https://github.com/formally-fm/formally"
version = "0.2.0"
edition = "2024"
license-file = "LICENSE.txt"
readme = "README.md"
categories = [ "mathematics" ]
keywords = [ "formal-methods" ]

[features]
default = []
__subcratedoc = []

[dependencies]
formally-support-macros = { path = "../support-macros", version = "0.2.0", features = ["__subcratedoc"] }

dashmap = "6.2.1"
perfect-derive = "0.1.5"
derive_more = { version = "2", features = ["from", "as_ref", "display"] }
rpds = "1"
thiserror = "2"
itertools = "0.15.0"
scoped-tls-hkt = "0.1.5"

[dev-dependencies]
formally-smt = { path = "../smt" }
